config firewall address
    edit "all"
    next
    edit "LAN_USERS"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "WEB_SRV"
        set subnet 172.16.10.10 255.255.255.255
    next
    edit "DB_SRV"
        set subnet 172.16.20.5 255.255.255.255
    next
    edit "MGMT_NET"
        set subnet 10.99.0.0 255.255.255.0
    next
    edit "CORP_WIDE"
        set subnet 10.0.0.0 255.0.0.0
    next
end
config firewall addrgrp
    edit "SERVERS"
        set member "WEB_SRV" "DB_SRV"
    next
end
config firewall service custom
    edit "APP_8443"
        set tcp-portrange 8443
    next
end
config firewall policy
    edit 1
        set name "Users-to-Web"
        set srcaddr "LAN_USERS"
        set dstaddr "WEB_SRV"
        set action accept
        set service "HTTPS" "APP_8443"
        set logtraffic all
        set comments "CHG-1021 web portal access"
    next
    edit 2
        set name "Mgmt-SSH"
        set srcaddr "MGMT_NET"
        set dstaddr "SERVERS"
        set action accept
        set service "SSH"
        set logtraffic all
        set comments "CHG-1002 admin access"
    next
    edit 3
        set name "Internet-RDP"
        set srcaddr "all"
        set dstaddr "WEB_SRV"
        set action accept
        set service "RDP"
        set logtraffic disable
    next
    edit 4
        set name "Block-DB"
        set srcaddr "LAN_USERS"
        set dstaddr "DB_SRV"
        set action deny
        set service "ALL"
    next
    edit 5
        set name "Users-to-DB-MySQL"
        set srcaddr "LAN_USERS"
        set dstaddr "DB_SRV"
        set action accept
        set service "MYSQL"
        set logtraffic all
        set comments "CHG-1045 reporting app"
    next
    edit 6
        set name "Web-dup"
        set srcaddr "LAN_USERS"
        set dstaddr "WEB_SRV"
        set action accept
        set service "HTTPS"
        set logtraffic all
        set comments "CHG-0990"
    next
    edit 7
        set name "Corp-wide-web"
        set srcaddr "CORP_WIDE"
        set dstaddr "WEB_SRV"
        set action accept
        set service "HTTP"
        set logtraffic all
        set comments ""
    next
    edit 8
        set name "Old-temp-rule"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
        set status disable
    next
    edit 9
        set name "Any-Any-Temp"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
        set logtraffic all
        set comments "temp troubleshooting"
    next
end
